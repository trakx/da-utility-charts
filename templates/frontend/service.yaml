{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: "{{ .Release.Name }}"
  name: "{{ .Release.Name }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: "{{ .Release.Name }}"
{{- end }}
